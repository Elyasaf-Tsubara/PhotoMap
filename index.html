<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10252b"><title>מפת התמונות</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css?v=26"></head><body><header><div><strong>📍 מפת התמונות</strong><small>מקומות דרך העיניים שלכם</small></div><button id="locate" type="button" aria-label="עבור למיקום שלי">⌖ מיקומי</button></header><main><div id="map" role="application" aria-label="מפת תמונות שיתופית"></div><div id="mapNotice" class="notice" hidden></div><div id="photoCount" class="counter">טוען תמונות...</div></main><nav class="bottomNav" aria-label="פעולות"><button id="mapTab" class="selected" type="button">🗺️ מפה</button><button id="cameraTab" type="button">📷 צלם והוסף</button><button id="galleryTab" type="button">▦ גלריה</button></nav><section id="galleryPanel" class="sheet" hidden><div class="sheetHead"><h2>תמונות במפה</h2><button class="closeSheet" type="button">✕</button></div><div id="gallery" class="gallery"></div></section><section id="uploadPanel" class="sheet" hidden><div class="sheetHead"><h2>הוסף תמונה למפה</h2><button class="closeSheet" type="button">✕</button></div><form id="uploadForm"><label class="uploadArea">📷 צילום או בחירת תמונה<input id="photoFile" type="file" accept="image/*" capture="environment" required></label><img id="preview" alt="תצוגה מקדימה" hidden><label>תיאור המקום<input id="photoTitle" maxlength="80" placeholder="לדוגמה: הנוף מהפארק" required></label><button id="getPosition" type="button" class="secondary">📍 קבל מיקום נוכחי</button><p id="positionText">לא נבחר מיקום. ניתן גם לבחור נקודה במפה.</p><label class="check"><input id="locationConsent" type="checkbox" required> אני מאשר/ת פרסום התמונה והמיקום שלה במפה ציבורית. לא אעלה תמונות של אנשים ללא רשות.</label><div id="turnstileWidget" aria-label="בדיקת אבטחה"></div><button id="publish" type="submit">פרסם תמונה</button><p id="uploadStatus" role="status"></p></form></section><dialog id="photoDialog"><button id="closePhoto" type="button" aria-label="סגור">✕</button><img id="largePhoto" alt=""><h2 id="largeTitle"></h2><p id="largeDetails"></p><button id="reportPhoto" type="button" class="secondary">דווח על תמונה</button></dialog><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js?v=28"></script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script><script src="script.js?v=28"></script></body></html>
